{% extends "base.html" %} {% block title %}Password Updated{% endblock %} {% block content %}
<div class="max-w-2xl mx-auto px-6 py-10">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 text-center">
        <div
            class="mx-auto mb-4 w-14 h-14 rounded-full bg-brand-yellow/20 flex items-center justify-center"
        >
            <span class="text-2xl">✓</span>
        </div>
        <h1 class="font-display text-2xl font-bold text-brand-indigo mb-2">
            Password updated
        </h1>
        <p class="text-sm text-gray-500 mb-6">
            Your password has been changed successfully.
        </p>
        <a
            href="{% url 'profile' %}"
            class="inline-block font-display text-sm font-medium text-white bg-brand-coral hover:bg-[#e6484d] rounded-lg px-4 py-2 transition-colors"
        >
            Back to profile
        </a>
    </div>
</div>
{% endblock %}
