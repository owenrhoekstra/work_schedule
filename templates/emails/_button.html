<table
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="margin: 24px 0"
>
    <tr>
        <td style="background-color: #ff5a5f; border-radius: 8px">
            <a
                href="{{ url }}"
                style="
                    display: inline-block;
                    padding: 14px 28px;
                    font-family: 'Space Grotesk', 'Segoe UI', Roboto, Helvetica,
                        Arial, sans-serif;
                    font-size: 15px;
                    font-weight: 500;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 8px;
                "
                >{{ text }}</a
            >
        </td>
    </tr>
</table>
