<dialog
    id="delete-pattern-modal"
    x-data="{ closing: false }"
    x-effect="
        if (deletePatternOpen && !$el.open) $el.showModal();
        if (!deletePatternOpen && $el.open && !closing) {
            closing = true;
            setTimeout(() => { $el.close(); closing = false; }, 200);
        }
    "
    :class="{ 'is-closing': closing }"
    @cancel.prevent="deletePatternOpen = false"
    @close="deletePatternOpen = false"
    class="modal-animate fixed rounded-xl p-0 backdrop:bg-black/40 w-full max-w-sm m-0"
>
    <div class="p-6 space-y-4">
        <h2 class="font-display text-lg font-bold text-brand-indigo">
            Delete pattern
        </h2>
        <p class="text-sm text-gray-500">
            Delete the pattern effective
            <strong class="text-brand-indigo" x-text="pendingDeleteDate"></strong>
            and every shift inside it? This can't be undone.
        </p>
        <div class="flex justify-end gap-2 pt-2">
            <button
                type="button"
                @click="deletePatternOpen = false"
                class="text-sm font-medium text-gray-500 hover:text-gray-700 px-4 py-2"
            >
                Cancel
            </button>
            <button
                type="button"
                @click="confirmDelete()"
                class="font-display text-sm font-medium text-white bg-brand-coral hover:bg-[#e6484d] rounded-lg px-4 py-2 transition-colors"
            >
                Delete pattern
            </button>
        </div>
    </div>
</dialog>
