<dialog
    id="deactivate-modal"
    x-data="{ closing: false }"
    x-effect="
        if (deactivateOpen && !$el.open) $el.showModal();
        if (!deactivateOpen && $el.open && !closing) {
            closing = true;
            setTimeout(() => { $el.close(); closing = false; }, 200);
        }
    "
    :class="{ 'is-closing': closing }"
    @cancel.prevent="deactivateOpen = false"
    @close="deactivateOpen = false"
    class="modal-animate fixed rounded-xl p-0 backdrop:bg-black/40 w-full max-w-sm m-0"
>
    <form
        method="post"
        action="{% url 'settings_deactivate_employee' employee.id %}"
        class="p-6 space-y-4"
    >
        {% csrf_token %}
        <h2 class="font-display text-lg font-bold text-brand-indigo">
            Set Last Day
        </h2>
        <p class="text-sm text-gray-500">{{ employee }}</p>
        <div>
            <label
                for="deactivate-last-day"
                class="block text-sm font-medium text-brand-indigo mb-1"
            >
                Last day
            </label>
            <input
                type="date"
                id="deactivate-last-day"
                name="last_day"
                x-model="deactivateDate"
                required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-coral"
            />
            <p class="text-xs text-gray-500 mt-1">
                Their final day on the schedule. Off from the following day.
            </p>
        </div>
        <label class="flex items-center gap-2 text-sm text-brand-indigo pt-2">
            <input
                type="checkbox"
                name="notify"
                value="1"
                class="accent-brand-coral"
            />
            Notify employee of this change
        </label>
        <div class="flex justify-end gap-2 pt-2">
            <button
                type="button"
                @click="deactivateOpen = false"
                class="text-sm font-medium text-gray-500 hover:text-gray-700 px-4 py-2"
            >
                Cancel
            </button>
            <button
                type="submit"
                class="font-display text-sm font-medium text-white bg-brand-coral hover:bg-[#e6484d] rounded-lg px-4 py-2 transition-colors"
            >
                Set Last Day
            </button>
        </div>
    </form>
</dialog>
