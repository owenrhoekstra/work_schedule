<dialog
    id="day-modal"
    data-url-template="{% url 'set_day_override' 'PLACEHOLDER' %}"
    x-data="{ closing: false }"
    x-effect="
        if (dayOpen && !$el.open) $el.showModal();
        if (!dayOpen && $el.open && !closing) {
            closing = true;
            setTimeout(() => { $el.close(); closing = false; }, 200);
        }
    "
    :class="{ 'is-closing': closing }"
    @cancel.prevent="dayOpen = false"
    @close="dayOpen = false"
    class="modal-animate fixed rounded-xl p-0 backdrop:bg-black/40 w-full max-w-sm m-0"
>
    <form
        method="post"
        id="day-form"
        :action="dayPostUrl"
        x-bind:hx-post="dayPostUrl || null"
        hx-target="#schedule-table"
        hx-swap="outerHTML"
        class="p-6 space-y-4"
    >
        {% csrf_token %}
        <h2 class="font-display text-lg font-bold text-brand-indigo">
            Mark day as closed
        </h2>
        <p class="text-sm text-gray-500" x-text="daySubtitle"></p>

        <div class="space-y-2 pt-2">
            <button
                type="submit"
                name="action"
                value="closed"
                class="w-full font-display text-sm font-medium text-white bg-brand-coral hover:bg-[#e6484d] rounded-lg px-4 py-2.5 transition-colors"
            >
                Mark as Closed
            </button>
            <button
                type="submit"
                name="action"
                value="holiday"
                class="w-full font-display text-sm font-medium text-brand-indigo border border-brand-indigo/30 hover:bg-brand-indigo/5 rounded-lg px-4 py-2.5 transition-colors"
            >
                Mark as Holiday
            </button>
            <button
                type="submit"
                name="action"
                value="clear"
                x-show="dayHasStatus"
                style="display: none;"
                class="w-full text-sm font-medium text-gray-500 hover:text-brand-coral px-4 py-2 transition-colors"
            >
                Clear
            </button>
        </div>

        <div class="flex justify-end pt-2 border-t border-gray-200">
            <button
                type="button"
                @click="dayOpen = false"
                class="text-sm font-medium text-gray-500 hover:text-gray-700 px-4 py-2"
            >
                Cancel
            </button>
        </div>
    </form>
</dialog>
