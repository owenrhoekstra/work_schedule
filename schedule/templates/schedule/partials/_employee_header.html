<div class="flex items-start justify-between mb-6 gap-3 flex-wrap">
    <div>
        <h1 class="font-display text-2xl font-bold text-brand-indigo">
            {{ employee }}
        </h1>
        <p class="text-sm text-gray-500">
            {{ employee.role }} · Started {{ employee.start_date|date:"F j, Y" }}
            {% if is_management and last_day %}
            ·
            <span class="text-brand-coral font-medium"
                >Last day {{ last_day|date:"F j, Y" }}</span
            >
            {% endif %}
        </p>
    </div>
    <div class="flex items-center gap-3 text-sm">
        <a
            href="{% url 'settings_home' %}"
            class="font-medium text-brand-coral hover:underline"
            >← Settings</a
        >
        <a
            href="{% url 'home' %}"
            class="font-medium text-brand-coral hover:underline"
            >← Schedule</a
        >
    </div>
</div>
