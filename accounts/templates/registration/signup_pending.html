{% load static tailwind_tags %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}" />
        <link rel="alternate icon" type="image/x-icon" href="{% static 'favicon.ico' %}" />
        <title>Account pending</title>
        {% tailwind_css %}
    </head>
    <body class="min-h-screen flex bg-brand-offwhite font-sans">
        <div
            class="hidden md:flex md:w-1/2 bg-brand-indigo relative overflow-hidden flex-col justify-center px-16"
        >
            <div
                class="absolute -bottom-24 -right-24 w-96 h-96 bg-brand-yellow rounded-full opacity-90"
            ></div>
            <div
                class="absolute top-20 -left-10 w-40 h-40 bg-brand-coral rounded-full opacity-60"
            ></div>
            <div class="relative z-10">
                <p class="text-brand-yellow font-display text-sm mb-4">
                    work schedule
                </p>
                <h1
                    class="font-display text-white text-5xl font-bold leading-tight mb-6"
                >
                    Almost<br />there.
                </h1>
                <p class="text-[#C7C4E8] text-base max-w-xs">
                    Your account just needs a quick approval before you can log
                    in.
                </p>
            </div>
        </div>

        <div
            class="w-full md:w-1/2 flex items-center justify-center px-6 py-12"
        >
            <div class="w-full max-w-sm text-center">
                <div
                    class="mx-auto mb-6 w-14 h-14 rounded-full bg-brand-yellow/20 flex items-center justify-center"
                >
                    <span class="text-2xl">⏳</span>
                </div>
                <h2
                    class="font-display text-2xl font-bold text-brand-indigo mb-2"
                >
                    Account created
                </h2>
                <p class="text-sm text-gray-500 mb-8">
                    Your account is waiting on approval from management. You'll
                    be able to log in once it's approved.
                </p>
                <a
                    href="{% url 'login' %}"
                    class="inline-block text-sm font-medium text-brand-coral hover:underline"
                >
                    Back to login
                </a>
            </div>
        </div>
    </body>
</html>
