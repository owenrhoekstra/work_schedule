[project]
name = "work-schedule"
version = "0.1.0"
description = "Work schedule app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "argon2-cffi>=25.1.0",
    "django-tailwind>=4.5.0",
    "whitenoise>=6.12.0",
    "django-axes>=8.3.1",
    "gunicorn>=26.2.0",
    "certifi>=2026.7.22",
    "redis[hiredis]>=8.1.0",
    "django-anymail[resend]>=15.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]

[tool.coverage.run]
source = ["schedule", "accounts", "work_schedule"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "manage.py",
]

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
